name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test -f VERSION
          test "$(tr -d '[:space:]' < VERSION)" = "$version"

          package="lichen-markdown-custom-${GITHUB_REF_NAME}.tar.gz"
          mkdir release
          cp -a src release/src
          cp VERSION update.sh release/
          cp run_build.sh run_dev.sh README.md LICENSE CHANGELOG.md release/
          tar -czf "$package" -C release .
          sha256sum "$package" > "$package.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "lichen-markdown-custom-${GITHUB_REF_NAME}.tar.gz" \
            "lichen-markdown-custom-${GITHUB_REF_NAME}.tar.gz.sha256" \
            --generate-notes
